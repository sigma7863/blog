lass="nd" text-anchor="middle">rooted 3rd-party sandbox</text><text x="120" y="270" class="nd" text-anchor="middle">(drives every step)</text><rect width="184" height="156" x="448" y="182" fill="#12161f" stroke="#e3b341" stroke-width="1.6" rx="10"/><text x="540" y="201" fill="#e3b341" class="tag" text-anchor="middle">HUGGING FACE</text><text x="540" y="221" class="nt" text-anchor="middle">HF Hub / API</text><text x="540" y="237" class="nd" text-anchor="middle">dataset upload + serve</text><rect width="190" height="78" x="735" y="151" fill="#12161f" stroke="#e3b341" stroke-width="1.6" rx="10"/><text x="830" y="170" fill="#e3b341" class="tag" text-anchor="middle">HUGGING FACE</text><text x="830" y="190" class="nt" text-anchor="middle">Dataset server</text><text x="830" y="206" class="nd" text-anchor="middle">config renderer</text><rect width="190" height="122" x="1105" y="199" fill="#12161f" stroke="#ff7b72" stroke-width="1.6" rx="10"/><text x="1200" y="218" fill="#ff7b72" class="tag" text-anchor="middle">PROD POD</text><text x="1200" y="238" class="nt" text-anchor="middle">Conversion worker</text><text x="1200" y="254" class="nd" text-anchor="middle">HDF5 read /</text><text x="1200" y="270" class="nd" text-anchor="middle">Jinja2 SSTI</text><rect width="190" height="78" x="735" y="291" fill="#12161f" stroke="#e8820c" stroke-width="1.6" rx="10"/><text x="830" y="310" fill="#e8820c" class="tag" text-anchor="middle">ATTACKER-CONTROLLED</text><text x="830" y="330" class="nt" text-anchor="middle">Dead-drop dataset</text><text x="830" y="346" class="nd" text-anchor="middle">gzip blobs in commits / branches</text><path fill="none" stroke="#e8820c" stroke-width="1.8" marker-end="url(#mk-orange)" d="M210,240 C317.1,240 340.9,225 448,225"/><rect width="192.2" height="20" x="233.9" y="135" fill="#0a0d13" fill-opacity=".9" stroke="#232a36" rx="5"/><text x="330" y="149" fill="#e8820c" class="el" text-anchor="middle">1 · upload malicious config</text><path fill="none" stroke="#8b94