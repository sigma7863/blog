<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500"><defs><marker id="mk-orange" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e8820c" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-mut" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8b949e" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#79c0ff" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,system-ui,sans-serif}.title{font-size:20px;font-weight:700;fill:#e6edf3}.sub{font-size:12.5px;fill:#8b949e}.nt,.tag{font-weight:700}.tag{font-size:9px;letter-spacing:.7px;font-family:ui-monospace,Menlo,monospace}.nt{font-size:13.5px;fill:#e6edf3}.nd{font-size:11px;fill:#8b949e}.el{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}.cap,.seg{font-size:12.5px;font-weight:700}.seg{font-size:12px;font-family:ui-monospace,Menlo,monospace}.segd{font-size:10.5px}.disp{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}</style><rect width="1280" height="500" fill="#0a0d13"/><text x="30" y="36" class="title">Improvised C2 protocol</text><text x="30" y="58" class="sub">The agent created a small typed message format on a public request-capture service (with dataset commits and error text as fallback transports).</text><rect width="210" height="78" x="45" y="111" fill="#12161f" stroke="#e8820c" stroke-width="1.6" rx="10"/><text x="150" y="130" fill="#e8820c" class="tag" text-anchor="middle">SENDER</text><text x="150" y="150" class="nt" text-anchor="middle">Foothold</text><text x="150" y="166" class="nd" text-anchor="middle">attack base / prod pod</text><rect width="236" height="78" x="352" y="111" fill="#12161f" stroke="#8b949e" stroke-width="1.6" rx="10"/><text x="470" y="130" fill="#8b949e" class="tag" text-anchor="middle">PUBLIC · MESSAGE BUS</text><text x="470" y="150" class="nt" text-anchor="middle">Request-capture service</text><text x="470" y="166" class="nd" text-anchor="middle">stores any text it receives</text><rect width="196" height="78" x="692" y="111" fill="#12161f" stroke="#79c0ff" stroke-width="1.6" rx="10"/><text x="790" y="130" fill="#79c0ff" class="tag" text-anchor="middle">RECEIVER</text><text x="790" y="150" class="nt" text-anchor="middle">Polling loop</text><text x="790" y="166" class="nd" text-anchor="middle">reads recent messages</text><rect width="196" height="78" x="992" y="111" fill="#12161f" stroke="#3fb950" stroke-width="1.6" rx="10"/><text x="1090" y="130" fill="#3fb950" class="tag" text-anchor="middle">DISPATCH</text><text x="1090" y="150" class="nt" text-anchor="middle">Decode &amp; run</text><text x="1090" y="166" class="nd" text-anchor="middle">by declared type</text><path fill="none" stroke="#e8820c" stroke-width="1.8" marker-end="url(#mk-orange)" d="M255,150 C298.65,150 308.35,150 352,150"/><rect width="113" height="20" x="247.5" y="105" fill="#0a0d13" fill-opacity=".9" stroke="#232a36" rx="5"/><text x="304" y="119" fill="#e8820c" class="el" text-anchor="middle">① post envelope</text><path fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk-mut)" d="M588,150 C634.8,150 645.2,150 692,150"/><rect width="53.6" height="20" x="613.2" y="105" fill="#0a0d13" fill-opacity=".9" stroke="#232a36" rx="5"/><text x="640" y="119" fill="#8b949e" class="el" text-anchor="middle">② poll</text><path fill="none" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#mk-blue)" d="M888,150 C934.8,150 945.2,150 992,150"/><rect width="93.2" height="20" x="893.4" y="105" fill="#0a0d13" fill-opacity=".9" stroke="#232a36" rx="5"/><text x="940" y="119" fill="#79c0ff" class="el" text-anchor="middle">③ reassemble</text><text x="90" y="238" fill="#e6edf3" class="cap">The self-describing envelope</text><rect width="172" height="48" x="90" y="250" fill="#ff7b7222" stroke="#ff7b72" stroke-width="1.5" rx="7"/><text x="176" y="272" fill="#ff7b72" class="seg" text-anchor="middle">‹type›</text><text x="176" y="289" fill="#8b949e" class="segd" text-anchor="middle">what kind of payload</text><rect width="172" height="48" x="266" y="250" fill="#a371f722" stroke="#a371f7" stroke-width="1.5" rx="7"/><text x="352" y="272" fill="#a371f7" class="seg" text-anchor="middle">‹channel›</text><text x="352" y="289" fill="#8b949e" class="segd" text-anchor="middle">which message stream</text><rect width="128" height="48" x="442" y="250" fill="#e3b34122" stroke="#e3b341" stroke-width="1.5" rx="7"/><text x="506" y="272" fill="#e3b341" class="seg" text-anchor="middle">‹seq›</text><text x="506" y="289" fill="#8b949e" class="segd" text-anchor="middle">chunk order</text><rect width="436" height="48" x="574" y="250" fill="#79c0ff22" stroke="#79c0ff" stroke-width="1.5" rx="7"/><text x="792" y="272" fill="#79c0ff" class="seg" text-anchor="middle">‹body›</text><text x="792" y="289" fill="#8b949e" class="segd" text-anchor="middle">base64 of compressed bytes</text><rect width="172" height="48" x="1014" y="250" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5" rx="7"/><text x="1100" y="272" fill="#3fb950" class="seg" text-anchor="middle">‹sum›</text><text x="1100" y="289" fill="#8b949e" class="segd" text-anchor="middle">integrity check</text><text x="90" y="360" fill="#e6edf3" class="cap">Receiver: keep my channel ▸ order by seq ▸ verify sum ▸ dispatch on type</text><text x="90" y="386" fill="#8b949e" class="disp">type ⇒ run as shell · exec as script stage · or store as a result</text><rect width="1100" height="52" x="90" y="420" fill="#12161f" stroke="#232a36" rx="10"/><text x="106" y="441" fill="#e3b341" class="cap">Same envelope, other transports</text><text x="106" y="460" fill="#8b949e" class="segd">carried equally over a capture-service URL · a dataset commit (dead-drop) · or text smuggled inside an error message: so closing one channel does not break it.</text></svg>