" height="150" x="300" y="496" fill="#f8514914" stroke="#f85149" stroke-opacity=".5" stroke-width="1.2" rx="14"/><text x="316" y="517" fill="#f85149" class="zone">Hugging Face internal network</text><rect width="208" height="78" x="328" y="527" fill="#12161f" stroke="#ff7b72" stroke-width="1.6" rx="10"/><text x="432" y="546" fill="#ff7b72" class="tag" text-anchor="middle">STAGE 2 · FROM POD</text><text x="432" y="566" class="nt" text-anchor="middle">Cloud metadata (IMDS)</text><text x="432" y="582" class="nd" text-anchor="middle">EC2 node role creds</text><rect width="220" height="78" x="562" y="527" fill="#12161f" stroke="#ff7b72" stroke-width="1.6" rx="10"/><text x="672" y="546" fill="#ff7b72" class="tag" text-anchor="middle">STAGE 2 · FROM POD</text><text x="672" y="566" class="nt" text-anchor="middle">Kubernetes API</text><text x="672" y="582" class="nd" text-anchor="middle">node impersonation</text><text x="672" y="598" class="nd" text-anchor="middle">CSI service-account tokens</text><rect width="214" height="78" x="843" y="527" fill="#12161f" stroke="#a371f7" stroke-width="1.6" rx="10"/><text x="950" y="546" fill="#a371f7" class="tag" text-anchor="middle">VIA MESH VPN</text><text x="950" y="566" class="nt" text-anchor="middle">Cluster catalog</text><text x="950" y="582" class="nd" text-anchor="middle">conn URLs + CA certs</text><text x="950" y="598" class="nd" text-anchor="middle">→ access to some clusters</text><rect width="220" height="78" x="1086" y="527" fill="#12161f" stroke="#f778ba" stroke-width="1.6" rx="10"/><text x="1196" y="546" fill="#f778ba" class="tag" text-anchor="middle">VIA MESH VPN</text><text x="1196" y="566" class="nt" text-anchor="middle">Source control</text><text x="1196" y="582" class="nd" text-anchor="middle">GitHub App tokens</text><text x="1196" y="598" class="nd" text-anchor="middle">PR → CI compromise (blocked)</text><path fill="none" stroke="#ff7b72" stroke-width="1.8" marker-end="url(#mk-k8s)" d="M560,414 C508.8,414 483.2,527 432,527"/><rect width="80" height="20" x="430" y="457" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="470" y="469" fill="#ff7b72" class="el" text-anchor="middle">node creds</text><path fill="none" stroke="#ff7b72" stroke-width="1.8" marker-end="url(#mk-k8s)" d="M636,414 C636,464.85 672,476.15 672,527"/><rect width="119.6" height="20" x="630.2" y="457" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="690" y="469" fill="#ff7b72" class="el" text-anchor="middle">impersonate node</text><path fill="none" stroke="#a371f7" stroke-width="1.8" marker-end="url(#mk-purple)" d="M1030,414 C1030,464.85 950,476.15 950,527"/><rect width="172.4" height="20" x="871.8" y="457" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="958" y="469" fill="#a371f7" class="el" text-anchor="middle">catalog + cluster access</text><path fill="none" stroke="#f778ba" stroke-width="1.8" marker-end="url(#mk-pink)" d="M1110,414 C1110,464.85 1196,476.15 1196,527"/><rect width="113" height="20" x="1131.5" y="457" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="1188" y="469" fill="#f778ba" class="el" text-anchor="middle">mint app tokens</text></svg>