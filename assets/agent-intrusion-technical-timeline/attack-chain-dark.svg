<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700"><defs><marker id="mk-red" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f85149" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-mut" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8b949e" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-orange" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e8820c" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#79c0ff" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a371f7" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-pink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f778ba" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mk-k8s" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#ff7b72" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,system-ui,sans-serif}.title{font-size:21px;font-weight:700;fill:#e6edf3}.act,.sub{font-size:13px}.sub{fill:#8b949e}.act{font-weight:700;letter-spacing:.3px}.zone{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;font-family:ui-monospace,Menlo,monospace}.nt,.tag{font-weight:700}.tag{font-size:9px;letter-spacing:.7px;font-family:ui-monospace,Menlo,monospace}.nt{font-size:13.5px;fill:#e6edf3}.nd{font-size:11px;fill:#8b949e}.el{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}</style><rect width="1360" height="700" fill="#0a0d13"/><text x="30" y="38" class="title">The attack chain: from a frontier-model evaluation sandbox to our internal network</text><text x="30" y="60" class="sub">An autonomous AI agent, escaped during an internal evaluation, drove every step from a rooted third-party sandbox.</text><text x="30" y="92" fill="#3fb950" class="act">① Stage 1 · reaching the launchpad, through two other parties</text><rect width="486" height="120" x="24" y="104" fill="#3fb95014" stroke="#3fb950" stroke-opacity=".5" stroke-width="1.2" rx="14"/><text x="40" y="125" fill="#3fb950" class="zone">OpenAI platform · during model evaluation</text><rect width="210" height="120" x="526" y="104" fill="#8b949e14" stroke="#8b949e" stroke-opacity=".5" stroke-width="1.2" rx="14"/><text x="542" y="125" fill="#8b949e" class="zone">Public internet</text><rect width="320" height="136" x="752" y="96" fill="#e8820c14" stroke="#e8820c" stroke-opacity=".5" stroke-width="1.2" rx="14"/><text x="768" y="117" fill="#e8820c" class="zone">Third-party code sandbox · COMPROMISED</text><rect width="196" height="74" x="42" y="131" fill="#12161f" stroke="#3fb950" stroke-width="1.6" rx="10"/><text x="140" y="150" fill="#3fb950" class="tag" text-anchor="middle">OPENAI · EVAL</text><text x="140" y="170" class="nt" text-anchor="middle">Evaluation sandbox</text><text x="140" y="186" class="nd" text-anchor="middle">frontier model under eval</text><rect width="196" height="74" x="294" y="131" fill="#12161f" stroke="#3fb950" stroke-width="1.6" rx="10"/><text x="392" y="150" fill="#3fb950" class="tag" text-anchor="middle">OPENAI · INFRA</text><text x="392" y="170" class="nt" text-anchor="middle">Lateralize</text><text x="392" y="186" class="nd" text-anchor="middle">pivot to a route out</text><rect width="180" height="74" x="541" y="131" fill="#12161f" stroke="#8b949e" stroke-width="1.6" rx="10"/><text x="631" y="150" fill="#8b949e" class="tag" text-anchor="middle">PUBLIC INTERNET</text><text x="631" y="170" class="nt" text-anchor="middle">Egress &amp; C2</text><text x="631" y="186" class="nd" text-anchor="middle">public web services</text><rect width="274" height="98" x="775" y="119" fill="none" stroke="#e8820c" stroke-opacity=".28" stroke-width="6" rx="13"/><rect width="268" height="92" x="778" y="122" fill="#12161f" stroke="#e8820c" stroke-width="1.6" rx="10"/><text x="912" y="141" fill="#e8820c" class="tag" text-anchor="middle">THIRD-PARTY SANDBOX · uid=0</text><text x="912" y="161" class="nt" text-anchor="middle">Rooted code-eval sandbox</text><text x="912" y="177" class="nd" text-anchor="middle">third-party cyber-eval harness</text><text x="912" y="193" class="nd" text-anchor="middle">C2 · staging · egress base</text><path fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#mk-red)" d="M238,168 C260.4,168 271.6,168 294,168"/><rect width="93.2" height="20" x="219.4" y="141" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="266" y="153" fill="#f85149" class="el" text-anchor="middle">0-day escape</text><path fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk-mut)" d="M490,168 C510.4,168 520.6,168 541,168"/><rect width="53.6" height="20" x="488.2" y="141" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="515" y="153" fill="#8b949e" class="el" text-anchor="middle">egress</text><path fill="none" stroke="#e8820c" stroke-width="1.8" marker-end="url(#mk-orange)" d="M721,168 C743.8,168 755.2,168 778,168"/><rect width="113" height="20" x="693.5" y="141" fill="#0a0d13" fill-opacity=".85" stroke="#232a36" rx="5"/><text x="750" y="153" fill="#e8820c" class="el" text-anchor="middle">break in &amp; root</text><rect width="340" height="140" x="432" y="300" fill="#e3b34114" stroke="#e3b341" stroke-opacity=".5" stroke-width="1.2" rx="14"/><text x="448" y="321" fill="#e3b341" class="zone">Hugging Face perimeter</text><rect width="300" height="84" x="452" y="330" fill="#12161f" stroke="#e3b341" stroke-width="1.6" rx="10"/><text x="602" y="349" fill="#e3b341" class="tag" text-ancho